name: Extractor check

# Weekly check that the vendored yt-dlp engine can still read the officially
# tested sites (README.md: YouTube only, videos and playlists). Sites change
# their pages without notice, so an engine that passed CI can break later.
#
# The `check` job runs scripts/check_extractors.py, which calls the vendored
# engine through the app's own wrapper with extract_info(download=False). It
# fails if an extraction fails or a video returns no formats. The `report` job
# then opens one issue labelled `extractor-broken`, or comments on the open
# one. When the check passes again, it closes that issue.
#
# YouTube sometimes answers a runner's cloud IP address with "Sign in to
# confirm you're not a bot". That result is "blocked": inconclusive, not an
# engine fault. The job then passes with a warning and the issue is left as
# it is.
#
# A pull request that changes the check itself also runs the `check` job, so
# a change is tested before it merges. Pull request runs never touch issues.

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [ main, dev ]
    paths:
      - .github/workflows/extractor-check.yml
      - scripts/check_extractors.py

permissions:
  contents: read

concurrency:
  group: extractor-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check YouTube extraction
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.check.outputs.outcome }}
    steps:
    - name: Harden runner
      # See build.yml (lint job) for the rationale. Baseline plus the hosts
      # the check calls: the Deno release download (github.com, redirects to
      # release-assets.githubusercontent.com), www.youtube.com for the video
      # and playlist pages, and manifest.googlevideo.com for the HLS/DASH
      # format manifests. No media is downloaded, so the *.googlevideo.com
      # media hosts are not needed.
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: block
        disable-sudo: true                 # no apt/sudo step in this job
        allowed-endpoints: >
          api.github.com:443
          codeload.github.com:443
          files.pythonhosted.org:443
          github.com:443
          manifest.googlevideo.com:443
          objects.githubusercontent.com:443
          pypi.org:443
          raw.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          results-receiver.actions.githubusercontent.com:443
          www.youtube.com:443
          youtube.com:443
          *.blob.core.windows.net:443

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false   # no job here pushes via git

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --require-hashes -r requirements/pip.txt --only-binary :all:
        python -m pip install --require-hashes -r requirements/lock.txt --only-binary :all:

    - name: Check extractors
      # The script gets Deno itself through src/utils/deno_installer.py, the
      # same path a source run uses: the pinned version, checked against the
      # SHA-256 pinned in that file before it is used.
      # Exit code 0 = pass, 1 = fail, 2 = blocked by the bot check.
      id: check
      run: |
        set +e
        python scripts/check_extractors.py --report
        rc=$?
        set -e
        case "$rc" in
          0) outcome=pass ;;
          2) outcome=blocked ;;
          *) outcome=fail ;;
        esac
        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        if [ "$outcome" = blocked ]; then
          echo "::warning title=Extractor check inconclusive::YouTube asked this runner to sign in to confirm it is not a bot. No check failed; see the report."
        fi
        [ "$outcome" != fail ]

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: extractor-report
        path: extractor-report.md
        if-no-files-found: warn
        retention-days: 7         # the repository maximum

  report:
    name: Report to issue
    needs: check
    # Runs after a pass or a fail, not after a cancel or a skip, and never
    # for a pull request.
    if: >
      always() &&
      github.event_name != 'pull_request' &&
      (needs.check.result == 'success' || needs.check.result == 'failure')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write       # create the label, open, comment on and close the issue
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: block
        disable-sudo: true                 # no sudo step in this job
        allowed-endpoints: >
          api.github.com:443
          results-receiver.actions.githubusercontent.com:443
          *.blob.core.windows.net:443

    - name: Download report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true   # the check job can fail before it writes a report
      with:
        name: extractor-report

    - name: Open, update or close the issue
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        CHECK_RESULT: ${{ needs.check.result }}
        OUTCOME: ${{ needs.check.outputs.outcome }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        label=extractor-broken
        open=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')

        {
          echo "Run: $RUN_URL (branch \`$REF_NAME\`)"
          echo
          if [ -s extractor-report.md ]; then
            cat extractor-report.md
          else
            echo "No report was written. The job failed before the check ran; see the run log."
          fi
        } > body.md

        # The check job fails only on a real failure or before the check ran.
        if [ "$CHECK_RESULT" = "failure" ]; then OUTCOME=fail; fi
        echo "Outcome: ${OUTCOME:-unknown}"

        if [ "$OUTCOME" = "blocked" ]; then
          echo "Inconclusive (bot check). The issue, if any, stays as it is."
        elif [ "$OUTCOME" = "fail" ]; then
          gh label create "$label" --color B60205 \
            --description "The weekly extractor check failed" --force
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
            echo "Commented on issue #$open"
          else
            gh issue create --label "$label" \
              --title "Extractor check failed: YouTube extraction is broken" \
              --body-file body.md
          fi
        elif [ "$OUTCOME" = "pass" ] && [ -n "$open" ]; then
          {
            echo "The extractor check passes again, so this issue is closed."
            echo
            cat body.md
          } > close.md
          gh issue close "$open" --comment "$(cat close.md)"
          echo "Closed issue #$open"
        else
          echo "No issue to open or close. Nothing to do."
        fi
