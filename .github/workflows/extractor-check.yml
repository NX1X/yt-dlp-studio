name: Extractor check

# Weekly check that the vendored yt-dlp engine can still read the sites that
# the CI covers: YouTube (one video and one playlist) and TikTok (one public
# video). Instagram, Facebook and X are checked by hand before each release.
# Sites change their pages without notice, so an engine that passed CI can
# break later.
#
# The `check` job runs scripts/check_extractors.py once per site. It calls the
# vendored engine through the app's own wrapper with extract_info(download=False)
# and downloads no media. A site check fails if an extraction fails or a video
# returns no formats. The `report` job then opens one issue per site, labelled
# `extractor-broken` (the title names the site), or comments on the open one.
# When the check passes again, it closes that issue.
#
# A site sometimes answers a runner's cloud IP address with a block: YouTube
# with "Sign in to confirm you're not a bot", TikTok with "Your IP address is
# blocked", a login page, or HTTP 403 or 429. That result is "blocked":
# inconclusive, not an engine fault. The job then passes with a warning and the
# issue is left as it is.
#
# The TikTok check runs only on GitHub's runners. The script refuses to run it
# anywhere else, so no developer machine contacts TikTok.
#
# A pull request that changes the check itself also runs the `check` job, so
# a change is tested before it merges. Pull request runs never touch issues.

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [ main, dev ]
    paths:
      - .github/workflows/extractor-check.yml
      - scripts/check_extractors.py

permissions:
  contents: read

concurrency:
  group: extractor-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check YouTube and TikTok extraction
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.check.outputs.outcome }}
      tiktok_outcome: ${{ steps.tiktok.outputs.outcome }}
    steps:
    - name: Harden runner
      # See build.yml (lint job) for the rationale. Baseline plus the hosts
      # the check calls: the Deno release download (github.com, redirects to
      # release-assets.githubusercontent.com), www.youtube.com for the video
      # and playlist pages, and manifest.googlevideo.com for the HLS/DASH
      # format manifests. No media is downloaded, so the *.googlevideo.com
      # media hosts are not needed. TikTok: yt-dlp reads the video web page on
      # www.tiktok.com. Its mobile API host (api16-normal-c-useast1a.tiktokv.com)
      # is used only when the app_info extractor argument is set, which this
      # app never does, and the media CDN hosts only for a download.
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: block
        disable-sudo: true                 # no apt/sudo step in this job
        allowed-endpoints: >
          api.github.com:443
          codeload.github.com:443
          files.pythonhosted.org:443
          github.com:443
          manifest.googlevideo.com:443
          objects.githubusercontent.com:443
          pypi.org:443
          raw.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          results-receiver.actions.githubusercontent.com:443
          tiktok.com:443
          www.tiktok.com:443
          www.youtube.com:443
          youtube.com:443
          *.blob.core.windows.net:443

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false   # no job here pushes via git

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --require-hashes -r requirements/pip.txt --only-binary :all:
        python -m pip install --require-hashes -r requirements/lock.txt --only-binary :all:

    - name: Check YouTube
      # The script gets Deno itself through src/utils/deno_installer.py, the
      # same path a source run uses: the pinned version, checked against the
      # SHA-256 pinned in that file before it is used.
      # Exit code 0 = pass, 1 = fail, 2 = blocked by the bot check.
      id: check
      run: |
        set +e
        python scripts/check_extractors.py --report
        rc=$?
        set -e
        case "$rc" in
          0) outcome=pass ;;
          2) outcome=blocked ;;
          *) outcome=fail ;;
        esac
        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        if [ "$outcome" = blocked ]; then
          echo "::warning title=Extractor check inconclusive::YouTube asked this runner to sign in to confirm it is not a bot. No check failed; see the report."
        fi
        [ "$outcome" != fail ]

    - name: Check TikTok
      # Runs even if the YouTube check failed, so one site never hides the
      # other. It reads the info of one public video, no download. The script
      # refuses to run it outside GitHub Actions.
      # Exit code 0 = pass, 1 = fail, 2 = blocked by TikTok.
      id: tiktok
      if: always() && steps.check.outcome != 'skipped'
      run: |
        set +e
        python scripts/check_extractors.py --site tiktok --report
        rc=$?
        set -e
        case "$rc" in
          0) outcome=pass ;;
          2) outcome=blocked ;;
          *) outcome=fail ;;
        esac
        echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        if [ "$outcome" = blocked ]; then
          echo "::warning title=TikTok check inconclusive::TikTok blocked this runner (IP address, login, bot check, HTTP 403 or 429). No check failed; see the report."
        fi
        [ "$outcome" != fail ]

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: extractor-report
        path: extractor-report*.md
        if-no-files-found: warn
        retention-days: 7         # the repository maximum

  report:
    name: Report to issue
    needs: check
    # Runs after a pass or a fail, not after a cancel or a skip, and never
    # for a pull request.
    if: >
      always() &&
      github.event_name != 'pull_request' &&
      (needs.check.result == 'success' || needs.check.result == 'failure')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write       # create the label, open, comment on and close the issue
    steps:
    - name: Harden runner
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: block
        disable-sudo: true                 # no sudo step in this job
        allowed-endpoints: >
          api.github.com:443
          results-receiver.actions.githubusercontent.com:443
          *.blob.core.windows.net:443

    - name: Download report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true   # the check job can fail before it writes a report
      with:
        name: extractor-report

    - name: Open, update or close the issues
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        CHECK_RESULT: ${{ needs.check.result }}
        YOUTUBE_OUTCOME: ${{ needs.check.outputs.outcome }}
        TIKTOK_OUTCOME: ${{ needs.check.outputs.tiktok_outcome }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        label=extractor-broken

        # handle SITE REPORT_FILE OUTCOME
        # One issue per site: the open issue with the label whose title names the site.
        handle() {
          site="$1"; report="$2"; outcome="$3"
          echo "== $site =="
          open=$(gh issue list --label "$label" --state open --limit 50 --json number,title \
            | jq -r --arg site "$site" '[.[] | select(.title | contains($site))][0].number // empty')

          {
            echo "Run: $RUN_URL (branch \`$REF_NAME\`)"
            echo
            if [ -s "$report" ]; then
              cat "$report"
            else
              echo "No report was written. The job failed before the check ran; see the run log."
            fi
          } > "body-$site.md"

          echo "Outcome: ${outcome:-unknown}"

          if [ "$outcome" = "blocked" ]; then
            echo "Inconclusive (blocked by the site). The issue, if any, stays as it is."
          elif [ "$outcome" = "fail" ]; then
            gh label create "$label" --color B60205 \
              --description "The weekly extractor check failed" --force
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file "body-$site.md"
              echo "Commented on issue #$open"
            else
              gh issue create --label "$label" \
                --title "Extractor check failed: $site extraction is broken" \
                --body-file "body-$site.md"
            fi
          elif [ "$outcome" = "pass" ] && [ -n "$open" ]; then
            {
              echo "The extractor check passes again, so this issue is closed."
              echo
              cat "body-$site.md"
            } > "close-$site.md"
            gh issue close "$open" --comment "$(cat "close-$site.md")"
            echo "Closed issue #$open"
          else
            echo "No issue to open or close. Nothing to do."
          fi
        }

        # The check job fails only on a real failure or before the checks ran.
        # If it failed and left no YouTube outcome, the failure belongs to
        # YouTube (the setup steps run before any site). A missing TikTok
        # outcome opens nothing.
        if [ "$CHECK_RESULT" = "failure" ] && [ -z "$YOUTUBE_OUTCOME" ]; then YOUTUBE_OUTCOME=fail; fi

        handle YouTube extractor-report.md "$YOUTUBE_OUTCOME"
        handle TikTok extractor-report-tiktok.md "$TIKTOK_OUTCOME"
