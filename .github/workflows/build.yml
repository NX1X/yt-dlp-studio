name: CI - YT-DLP Studio

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

# Least-privilege default for all jobs. Individual jobs override as needed.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
    - name: Harden runner
      # StepSecurity harden-runner: enforces a per-job network egress allowlist
      # on the GitHub-hosted runner. `block` mode rejects any outbound call to
      # a host not listed below; the live network log appears in the job's
      # "Harden Runner" summary tab. This catches an action or transitive
      # dependency exfiltrating data or pulling from an unexpected origin.
      # SHA pinned (Renovate keeps the digest current; matches the repo
      # convention for every other third-party action).
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: block
        disable-sudo: true                 # no apt/sudo step in this job
        allowed-endpoints: >
          api.github.com:443
          codeload.github.com:443
          files.pythonhosted.org:443
          github.com:443
          objects.githubusercontent.com:443
          pypi.org:443
          raw.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          results-receiver.actions.githubusercontent.com:443
          *.blob.core.windows.net:443

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false   # no job here pushes via git

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14.10'

    - name: Install linting tools
      # Hash-pinned CI tooling (see requirements/ci-tools.in).
      run: 'python -m pip install --require-hashes -r requirements/ci-tools.txt --only-binary :all:'

    - name: Run ruff linter
      run: ruff check src/ tests/ launcher.py --output-format=github

    - name: Check black formatting
      run: black --check --diff src/ tests/ launcher.py
      continue-on-error: true

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Runner labels are pinned (no "-latest"). The job names, "Tests
        # (ubuntu-26.04)" and "Tests (windows-2025)", are the required checks
        # in the repo ruleset. windows-2022 adds the older Windows Server
        # image. These are Windows Server runner images, not Windows 10 or 11.
        os: [ubuntu-26.04, windows-2025, windows-2022]
    steps:
    - name: Harden runner
      # See lint job for rationale. This job runs on both ubuntu and windows
      # via matrix; the same policy is applied to both. The Linux leg uses
      # apt (`sudo apt-get`), so disable-sudo MUST be false. Port-80 entries
      # are for the Ubuntu apt mirror (HTTP-only on the Azure-backed mirror).
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: block
        disable-sudo: false                # Linux leg runs `sudo apt-get`
        allowed-endpoints: >
          api.github.com:443
          azure.archive.ubuntu.com:80
          codeload.github.com:443
          esm.ubuntu.com:443
          files.pythonhosted.org:443
          github.com:443
          objects.githubusercontent.com:443
          packages.microsoft.com:443
          pypi.org:443
          raw.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          results-receiver.actions.githubusercontent.com:443
          security.ubuntu.com:80
          *.blob.core.windows.net:443

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false   # no job here pushes via git

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14.10'

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

    - name: Install Python dependencies
      run: |
        python -m pip install --require-hashes -r requirements/pip.txt --only-binary :all:
        python -m pip install --require-hashes -r requirements/lock.txt --only-binary :all:
        python -m pip install --require-hashes -r requirements/dev.txt --only-binary :all:

    - name: Run smoke tests
      run: bash tests/test_smoke.sh
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Run tests (Linux)
      if: runner.os == 'Linux'
      run: |
        xvfb-run --auto-servernum pytest tests/ -v --tb=short --junitxml=test-results.xml --cov=src --cov-report=xml
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: pytest tests/ -v --tb=short --junitxml=test-results.xml --cov=src --cov-report=xml
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results-${{ matrix.os }}
        path: test-results.xml
        retention-days: 7

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-${{ matrix.os }}
        path: coverage.xml
        retention-days: 7

  build-windows:
    name: Build Windows Executable
    needs: [lint, test]
    runs-on: windows-2025
    timeout-minutes: 45
    # Run on direct pushes to main/dev AND on every pull request, so
    # PyInstaller-only regressions (missing hidden imports, broken bundle
    # paths, vendored-engine path math that only matters under _MEIPASS)
    # surface in the PR instead of after merge. PR builds upload an
    # artifact for manual smoke testing but are NOT promoted to releases.
    if: >
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      id-token: write       # OIDC token for Sigstore signing
      attestations: write   # Publish build provenance attestation
    env:
      # Pinned third-party binaries.
      # When bumping a version, update the matching SHA-256 in the same commit.
      # Procedure: download the asset locally, run `Get-FileHash -Algorithm SHA256`,
      # cross-check against the publisher's own checksum file, then paste here.
      DENO_VERSION: "2.9.8"
      # Cross-checked against
      # https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-pc-windows-msvc.zip.sha256sum
      DENO_SHA256: "cba84b26e0df5ae7f74fc66b86a95b866872a86292ebd84fa1e959927edd93bf"
      FFMPEG_VERSION: "9.0.2"
      FFMPEG_SHA256: "4d2060a8b34a940aa47d785142055bb92a63053781e55f2ace4546edd519a8f5"
    steps:
    - name: Harden runner
      # See lint job for rationale. Windows runner, so no apt and disable-sudo
      # can stay true. Deno/FFmpeg downloads from github.com release URLs
      # redirect to objects.githubusercontent.com (the GitHub release CDN) -
      # both already in the baseline. Sigstore endpoints (incl. the often-
      # missed sigstore.github.com) are required by attest-build-provenance.
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: block
        disable-sudo: true                 # Windows; no sudo step
        allowed-endpoints: >
          api.github.com:443
          codeload.github.com:443
          files.pythonhosted.org:443
          fulcio.sigstore.dev:443
          github.com:443
          objects.githubusercontent.com:443
          pypi.org:443
          raw.githubusercontent.com:443
          rekor.sigstore.dev:443
          release-assets.githubusercontent.com:443
          results-receiver.actions.githubusercontent.com:443
          sigstore.github.com:443
          tuf-repo-cdn.sigstore.dev:443
          *.blob.core.windows.net:443

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false   # no job here pushes via git

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14.10'

    - name: Install dependencies
      # PyInstaller comes from its own hash-locked file (see
      # requirements/build-tools.in). The spec puts the project root on
      # pathex, so the project itself is never pip-installed to build.
      run: |
        python -m pip install --require-hashes -r requirements/pip.txt --only-binary :all:
        python -m pip install --require-hashes -r requirements/lock.txt --only-binary :all:
        python -m pip install --require-hashes -r requirements/build-tools.txt --only-binary :all:

    - name: Download and verify Deno
      run: |
        $ErrorActionPreference = "Stop"
        $version = $env:DENO_VERSION
        $base = "https://github.com/denoland/deno/releases/download/v$version"
        $assetUrl = "$base/deno-x86_64-pc-windows-msvc.zip"
        $sumUrl   = "$assetUrl.sha256sum"

        Write-Host "Downloading Deno $version from $assetUrl"
        Invoke-WebRequest -Uri $assetUrl -OutFile deno.zip
        Invoke-WebRequest -Uri $sumUrl   -OutFile deno.zip.sha256sum

        # Hash from the publisher's sidecar (defends against MITM / mirror tampering).
        # The sidecar layout varies (bare hash, "hash  file", or a multi-asset
        # checksums list), so extract the 64-hex digest robustly: prefer the line
        # naming our asset, else fall back to the only digest in the file.
        $assetName = "deno-x86_64-pc-windows-msvc.zip"
        $sumLines  = Get-Content deno.zip.sha256sum
        $publishedHash = $null
        foreach ($line in $sumLines) {
          if ($line -match [regex]::Escape($assetName)) {
            $m = [regex]::Match($line, '[A-Fa-f0-9]{64}')
            if ($m.Success) { $publishedHash = $m.Value.ToLower(); break }
          }
        }
        if (-not $publishedHash) {
          $m = [regex]::Match(($sumLines -join "`n"), '[A-Fa-f0-9]{64}')
          if ($m.Success) { $publishedHash = $m.Value.ToLower() }
        }
        if (-not $publishedHash) {
          Write-Error "Could not parse a SHA-256 from the Deno sidecar. Raw content:`n$($sumLines -join "`n")"
          exit 1
        }
        # Hash actually computed from what we received.
        $actualHash    = (Get-FileHash -Algorithm SHA256 deno.zip).Hash.ToLower()

        if ($actualHash -ne $publishedHash) {
          Write-Error "Deno SHA-256 mismatch vs publisher sidecar. Expected: $publishedHash  Actual: $actualHash"
          exit 1
        }

        # Hash hardcoded in the repo (defends against release compromise).
        # Empty string = first-time setup; print the value so the maintainer can pin it.
        $pinnedHash = $env:DENO_SHA256.ToLower()
        if ($pinnedHash -eq "") {
          Write-Warning "DENO_SHA256 is unset. Verified against publisher sidecar only."
          Write-Warning "Pin this value in build.yml after manual cross-check: $actualHash"
        } elseif ($actualHash -ne $pinnedHash) {
          Write-Error "Deno SHA-256 mismatch vs pinned hash. Pinned: $pinnedHash  Actual: $actualHash"
          exit 1
        }

        Write-Host "Deno SHA-256 verified: $actualHash"
        New-Item -ItemType Directory -Force -Path deno | Out-Null
        Expand-Archive -Path deno.zip -DestinationPath deno
        Remove-Item deno.zip, deno.zip.sha256sum
        deno/deno.exe --version

    - name: Download and verify FFmpeg
      run: |
        $ErrorActionPreference = "Stop"
        $version = $env:FFMPEG_VERSION
        # GyanD/codexffmpeg is the GitHub-hosted mirror of the gyan.dev builds.
        # Versioned URL (not the moving "release-full-shared" alias) so the artifact is reproducible.
        $assetUrl = "https://github.com/GyanD/codexffmpeg/releases/download/$version/ffmpeg-$version-full_build-shared.7z"

        Write-Host "Downloading FFmpeg $version from $assetUrl"
        Invoke-WebRequest -Uri $assetUrl -OutFile ffmpeg.7z

        $actualHash = (Get-FileHash -Algorithm SHA256 ffmpeg.7z).Hash.ToLower()
        $pinnedHash = $env:FFMPEG_SHA256.ToLower()
        if ($actualHash -ne $pinnedHash) {
          Write-Error "FFmpeg SHA-256 mismatch. Pinned: $pinnedHash  Actual: $actualHash"
          exit 1
        }
        Write-Host "FFmpeg SHA-256 verified: $actualHash"

        7z x ffmpeg.7z -offmpeg_temp
        New-Item -ItemType Directory -Force -Path ffmpeg/bin | Out-Null
        Copy-Item -Path "ffmpeg_temp/ffmpeg-*-full_build-shared/bin/ffmpeg.exe" -Destination "ffmpeg/bin/"
        Copy-Item -Path "ffmpeg_temp/ffmpeg-*-full_build-shared/bin/ffprobe.exe" -Destination "ffmpeg/bin/"
        Copy-Item -Path "ffmpeg_temp/ffmpeg-*-full_build-shared/bin/ffplay.exe" -Destination "ffmpeg/bin/" -ErrorAction SilentlyContinue
        Copy-Item -Path "ffmpeg_temp/ffmpeg-*-full_build-shared/bin/*.dll" -Destination "ffmpeg/bin/"
        Write-Host "FFmpeg files:"
        Get-ChildItem -Path "ffmpeg/bin" | Select-Object Name, Length
        Remove-Item ffmpeg.7z
        Remove-Item -Recurse ffmpeg_temp

    - name: Sync version metadata
      # Regenerates version_info.txt from src/__init__.py (`__version__`) so
      # CI builds always carry the canonical version, even on PRs that bumped
      # __version__ without re-running the script locally.
      run: python scripts/sync_version.py

    - name: Build executable
      run: pyinstaller packaging/build.spec

    - name: Check bundle contents
      # Opens the built executable and fails if a critical file is missing
      # (yt-dlp-ejs solver scripts, the vendored engine, FFmpeg, Deno) or banned
      # content (curl_cffi) got in. v0.1.3 shipped without the solver
      # scripts and every YouTube download failed; this check catches that.
      run: python scripts/check_bundle.py dist/yt-dlp-studio.exe

    - name: Build installer
      # Per-user Inno Setup installer around the SAME one-file EXE the portable
      # download ships (packaging/installer.iss). Inno Setup is preinstalled on
      # the windows-2022 and windows-2025 runner images; fail fast if it is
      # missing or not the 6.x line the script was written for.
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { Write-Error "Inno Setup 6 (ISCC.exe) not found on this runner"; exit 1 }
        # ISCC.exe carries no version resource (reads as 0.0.0.0), so check the
        # banner it prints instead, for example "Inno Setup 6 Command-Line Compiler".
        $banner = (& $iscc /? 2>&1 | Select-Object -First 3) -join " "
        Write-Host "ISCC: $banner"
        if ($banner -notmatch 'Inno Setup 6\b') { Write-Error "Expected Inno Setup 6, got: $banner"; exit 1 }
        $version = [regex]::Match((Get-Content src\__init__.py -Raw), '__version__\s*=\s*"([^"]+)"').Groups[1].Value
        if (-not $version) { Write-Error "could not read __version__ from src/__init__.py"; exit 1 }
        $numeric = ([regex]::Match($version, '^\d+\.\d+\.\d+').Value) + ".0"
        Write-Host "AppVersion=$version AppVersionNumeric=$numeric"
        & $iscc /Qp "/DAppVersion=$version" "/DAppVersionNumeric=$numeric" packaging\installer.iss
        if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with exit code $LASTEXITCODE"; exit 1 }
        $setup = Get-ChildItem dist\YT-DLP-Studio-Setup-*.exe | Select-Object -First 1
        if (-not $setup) { Write-Error "installer not produced"; exit 1 }
        Write-Host "Built $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"

    - name: Test installer
      timeout-minutes: 15
      # Silent per-user install, launch the INSTALLED GUI headless until it logs
      # "started successfully", silent uninstall (user data must survive), then
      # reinstall and uninstall with /PURGEDATA=yes (user data must go).
      run: |
        $setup = (Get-ChildItem dist\YT-DLP-Studio-Setup-*.exe | Select-Object -First 1).FullName
        powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test_installer.ps1 -Setup $setup
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Generate build provenance attestation
      # Produces a Sigstore-signed SLSA provenance statement binding the
      # exe's SHA-256 to this workflow file at this commit on this runner.
      # Verify with: gh attestation verify dist/yt-dlp-studio.exe --owner <owner>
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: 'dist/yt-dlp-studio.exe'

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: YT-DLP-Studio-Windows
        path: |
          dist/yt-dlp-studio.exe
          dist/YT-DLP-Studio-Setup-*.exe
        retention-days: 7

    - name: Display build info
      run: |
        Write-Host "Build completed successfully!"
        Write-Host "Executable location: dist/yt-dlp-studio.exe"
        $fileSize = (Get-Item "dist/yt-dlp-studio.exe").Length / 1MB
        Write-Host "File size: $([math]::Round($fileSize, 2)) MB"

  build-linux:
    name: Build Linux Executable
    needs: [lint, test]
    # Built in an ubuntu:22.04 container (glibc 2.35) on an ubuntu-26.04
    # runner. A PyInstaller binary only runs on a glibc at least as new as the
    # build host's, so the build-host glibc IS the compatibility floor for the
    # shipped binary. The runner image is 26.04 (newer glibc), which would
    # refuse to start on most distributions older than ~2024. 22.04's 2.35
    # covers Ubuntu 22.04+, Debian 12+, Fedora 36+, Mint 21+, and most
    # 2022-and-later distros. The container keeps that floor without the
    # ubuntu-22.04 runner label, which GitHub retires on 2027-04-17.
    # Keep this in lockstep with the build-linux job in release.yml.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Same rationale as build-windows: catch PyInstaller-only regressions
    # (missing hidden imports, broken bundle paths, vendored-engine path math
    # that only matters under _MEIPASS) on the Linux target in the PR, not
    # after merge. PR builds upload an artifact for manual smoke testing but
    # are NOT promoted to releases.
    if: >
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    env:
      # Build image, pinned by tag AND digest (multi-arch index). Bump both
      # together; read the digest from the registry with
      # `docker buildx imagetools inspect ubuntu:22.04`. Same value as in
      # release.yml.
      UBUNTU_IMAGE: ubuntu:22.04@sha256:b000e69a50ff940390233025e7a337fb8469b509e2334fa4d018ac30f3e18cdb
    steps:
    - name: Harden runner
      # See lint job for rationale. The build runs in a `docker run` step, not
      # a job container, because harden-runner does not run inside job
      # containers (same as test-fedora-rpm). The host needs no sudo. Allowed:
      # the baseline, the Docker Hub registry and its layer CDN (image pull),
      # and the Ubuntu archive for apt inside the container. uv,
      # python-build-standalone and the AppImage tools come from github.com
      # release assets; wheels from PyPI.
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: block
        disable-sudo: true                 # docker needs no sudo here
        allowed-endpoints: >
          api.github.com:443
          archive.ubuntu.com:80
          auth.docker.io:443
          codeload.github.com:443
          files.pythonhosted.org:443
          github.com:443
          objects.githubusercontent.com:443
          docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
          production.cloudfront.docker.com:443
          pypi.org:443
          raw.githubusercontent.com:443
          registry-1.docker.io:443
          release-assets.githubusercontent.com:443
          results-receiver.actions.githubusercontent.com:443
          security.ubuntu.com:80
          *.blob.core.windows.net:443

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false   # no job here pushes via git

    - name: Build and test in an Ubuntu 22.04 container
      # Runs scripts/ci_build_linux.sh as root in the pinned image: apt
      # packages, Python (uv, python-build-standalone), hash-locked
      # dependencies, PyInstaller build, bundle check, headless smoke test,
      # AppImage, .deb and .rpm, and the package test. The script hands the
      # files back to the runner user at the end. release.yml runs the same
      # script.
      run: |
        docker pull "$UBUNTU_IMAGE"
        docker run --rm \
          -e HOST_UID="$(id -u)" \
          -e HOST_GID="$(id -g)" \
          -v "$PWD:/work" \
          -w /work \
          "$UBUNTU_IMAGE" \
          bash scripts/ci_build_linux.sh

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: YT-DLP-Studio-Linux
        path: |
          dist/yt-dlp-studio
          dist/packages/*.AppImage
          dist/packages/*.deb
          dist/packages/*.rpm
        retention-days: 7

    - name: Display build info
      run: |
        echo "Build completed successfully!"
        echo "Executable location: dist/yt-dlp-studio"
        echo "File size: $(du -h dist/yt-dlp-studio | cut -f1)"

  test-fedora-rpm:
    name: Test .rpm on Fedora
    needs: [build-linux]
    # The build-linux job only extracts the .rpm on Ubuntu. This job installs
    # it with dnf on a real Fedora system, launches the installed app and
    # removes it again (see scripts/test_fedora_rpm.sh). Fedora runs in a
    # `docker run` step, not as a job container, because harden-runner does
    # not run inside job containers.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    if: >
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    env:
      # Current Fedora stable, pinned by tag AND digest (multi-arch index).
      # Bump both together; read the digest from the registry with
      # `docker buildx imagetools inspect registry.fedoraproject.org/fedora:<N>`.
      FEDORA_IMAGE: registry.fedoraproject.org/fedora:45@sha256:1bd80cd53c142fe07d25dac925494e02fa7aec33534ea30440e74f85014359a1
      # dnf uses this one https mirror instead of the Fedora metalink, so the
      # allowlist below stays small (Linux Foundation, US).
      FEDORA_MIRROR: https://mirrors.kernel.org/fedora
    steps:
    - name: Harden runner
      # See lint job for rationale. Baseline plus the Fedora registry and its
      # layer CDN (image pull) and the single dnf mirror. No sudo:
      # the runner user can use docker without it.
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: block
        disable-sudo: true                 # docker needs no sudo here
        allowed-endpoints: >
          api.github.com:443
          cdn.registry.fedoraproject.org:443
          codeload.github.com:443
          github.com:443
          mirrors.kernel.org:443
          objects.githubusercontent.com:443
          registry.fedoraproject.org:443
          results-receiver.actions.githubusercontent.com:443
          *.blob.core.windows.net:443

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false   # no job here pushes via git

    - name: Download Linux packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: YT-DLP-Studio-Linux
        path: linux-artifact

    - name: Install, launch and remove the .rpm on Fedora
      run: |
        rpms=(linux-artifact/packages/yt-dlp-studio-*.rpm)
        if [ "${#rpms[@]}" -ne 1 ] || [ ! -f "${rpms[0]}" ]; then
          echo "Expected exactly one .rpm in linux-artifact/packages"; ls -R linux-artifact; exit 1
        fi
        docker pull "$FEDORA_IMAGE"
        docker run --rm \
          -e FEDORA_MIRROR \
          -v "$PWD/scripts:/scripts:ro" \
          -v "$PWD/linux-artifact/packages:/packages:ro" \
          "$FEDORA_IMAGE" \
          bash /scripts/test_fedora_rpm.sh "/packages/$(basename "${rpms[0]}")"
