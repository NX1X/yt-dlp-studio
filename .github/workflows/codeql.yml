name: CodeQL

# Static analysis (SAST) for the Python source.
#
# Threat model note: this is a GUI-only desktop app with no public service,
# so the value here is catching injection / unsafe-subprocess / path-traversal
# style bugs in our own code before they ship inside the PyInstaller EXE.
#
# Action pinning: every action is pinned to a commit SHA (repo convention).
# checkout / setup-python reuse the exact SHAs from build.yml & release.yml.
# github/codeql-action is pinned to the v4.35.5 release commit; the v4 moving
# tag and the v4.35.5 tag were cross-checked to resolve to the same commit.
# Renovate (`helpers:pinGitHubActionDigests`) keeps these digests current.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Weekly catch-all so newly published CodeQL queries also re-scan main.
    - cron: '27 4 * * 1'  # Mondays 04:27 UTC
  workflow_dispatch:

# Least-privilege default; the analyze job grants only what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload SARIF results to code scanning
    steps:
    - name: Harden runner
      # StepSecurity harden-runner: per-job egress allowlist in `block` mode.
      # CodeQL needs non-obvious endpoints beyond the baseline:
      #   - ghcr.io + pkg-containers.githubusercontent.com — the
      #     `security-extended` query pack is delivered as an OCI artifact from
      #     GitHub Container Registry. Drop these two if `queries:` is removed.
      #   - release-assets.githubusercontent.com — the CodeQL CLI bundle
      #     (codeql-bundle-*.tar.zst) is a GitHub Release asset, and GitHub now
      #     redirects release-asset downloads to this host (previously
      #     objects.githubusercontent.com). Without it the "Initialize CodeQL"
      #     step fails at bundle download with ECONNREFUSED.
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: block
        disable-sudo: true                 # no apt step in this job
        allowed-endpoints: >
          api.github.com:443
          codeload.github.com:443
          files.pythonhosted.org:443
          ghcr.io:443
          github.com:443
          objects.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443
          pypi.org:443
          raw.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          results-receiver.actions.githubusercontent.com:443
          *.blob.core.windows.net:443

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false   # CodeQL only reads source, never pushes

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.14.7'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        languages: python
        # Python is interpreted: no compilation, extract the source directly.
        build-mode: none
        # security-extended adds higher-recall security queries on top of the
        # default suite (slightly slower, acceptable for a weekly + PR cadence).
        queries: security-extended
        # Exclude the huge vendored yt-dlp tree, the venv, and non-shipping
        # code. Only paths-ignore (no paths whitelist) — a whitelist plus
        # ignore list is brittle and can yield "no source found" errors.
        config: |
          paths-ignore:
            - vendor
            - venv
            - build
            - dist
            - tests

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        category: "/language:python"
