name: Release YT-DLP Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege default; jobs widen scope only where required.
permissions:
  contents: read

jobs:
  check-version:
    name: Check for new version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
    - name: Harden runner
      # StepSecurity harden-runner: per-job egress allowlist in `block` mode.
      # Tightest list in this workflow: only checkout (with full history),
      # local-only python script, and a `git ls-remote --tags origin` to
      # decide release immutability. Everything contacts github.com.
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: block
        disable-sudo: true
        allowed-endpoints: >
          api.github.com:443
          codeload.github.com:443
          github.com:443
          objects.githubusercontent.com:443
          raw.githubusercontent.com:443
          results-receiver.actions.githubusercontent.com:443
          *.blob.core.windows.net:443

    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
        persist-credentials: false   # only reads local tags, never pushes

    - name: Determine canonical version
      id: check
      run: |
        # Single source of truth: src/__init__.py (`__version__`).
        # CHANGELOG.md must contain a matching `## [VERSION]` entry — that's
        # validated below. version_info.txt is regenerated at build time by
        # scripts/sync_version.py.
        VERSION=$(python3 -c "import re,pathlib; m=re.search(r'^__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/__init__.py').read_text(), re.M); print(m.group(1) if m else '')")
        if [ -z "$VERSION" ]; then
          echo "::error::Could not parse __version__ from src/__init__.py"
          exit 1
        fi
        TAG="v${VERSION}"
        echo "Canonical version: $VERSION (tag: $TAG)"

        # Verify CHANGELOG.md has a matching entry (release without changelog is a bug)
        if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
          echo "::error::Version ${VERSION} (from src/__init__.py) has no '## [${VERSION}]' entry in CHANGELOG.md"
          exit 1
        fi

        # Prerelease ONLY when the version carries an explicit pre-release
        # suffix (e.g. 1.2.0-rc.1, 0.9.0-beta.2). A plain version - including
        # pre-1.0 like 0.9.0 - is a full release and becomes "Latest".
        if [[ "$VERSION" == *-* ]]; then
          IS_PRERELEASE=true
        else
          IS_PRERELEASE=false
        fi
        echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
        echo "Prerelease: $IS_PRERELEASE"

        # Immutable releases: a version is published exactly once. If the tag
        # already exists the release is frozen (release immutability + the
        # protect-tags ruleset) and CANNOT be regenerated - not even via a
        # manual workflow_dispatch. To ship anything, bump __version__ so a
        # NEW version/tag is cut.
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "::notice::Tag $TAG already exists - releases are immutable. Bump __version__ to publish a new release."
          echo "should_release=false" >> $GITHUB_OUTPUT
        else
          echo "Tag $TAG does not exist — will release"
          echo "should_release=true" >> $GITHUB_OUTPUT
        fi
        echo "version=$TAG" >> $GITHUB_OUTPUT

  test:
    name: Tests (${{ matrix.os }})
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - name: Harden runner
      # StepSecurity harden-runner: per-job egress allowlist in `block` mode.
      # Mirrors build.yml's test job: pip from PyPI, Linux leg uses apt for
      # xvfb/EGL/dbus libs (so disable-sudo MUST be false).
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: block
        disable-sudo: false                # Linux leg runs `sudo apt-get`
        allowed-endpoints: >
          api.github.com:443
          azure.archive.ubuntu.com:80
          codeload.github.com:443
          esm.ubuntu.com:443
          files.pythonhosted.org:443
          github.com:443
          objects.githubusercontent.com:443
          packages.microsoft.com:443
          pypi.org:443
          raw.githubusercontent.com:443
          results-receiver.actions.githubusercontent.com:443
          security.ubuntu.com:80
          *.blob.core.windows.net:443

    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false   # tests never push via git

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip==26.1.2
        pip install --require-hashes -r requirements/lock.txt
        pip install -e .[dev]

    - name: Run tests (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum pytest tests/ -v --tb=short
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: pytest tests/ -v --tb=short
      env:
        QT_QPA_PLATFORM: offscreen

  build-windows:
    name: Build Windows
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write       # OIDC token for Sigstore signing
      attestations: write   # Publish build provenance attestation
    env:
      # Pinned third-party binaries. MUST stay in lockstep with build.yml.
      # When bumping a version, update the matching SHA-256 in the same commit.
      # Procedure: download the asset locally, run `Get-FileHash -Algorithm SHA256`,
      # cross-check against the publisher's own checksum file, then paste here.
      DENO_VERSION: "2.6.10"
      # Cross-checked against
      # https://github.com/denoland/deno/releases/download/v2.6.10/deno-x86_64-pc-windows-msvc.zip.sha256sum
      DENO_SHA256: "6b26d272c2107ca63474c5702c824132a4a3e4469463edf0f327b9b5a5f5f854"
      FFMPEG_VERSION: "8.1.1"
      FFMPEG_SHA256: "7a6c3e86f54b0dd3bceff31f81bf3b70397171fcf35d1a13b9ed9cbf1040fc18"
    steps:
    - name: Harden runner
      # StepSecurity harden-runner: per-job egress allowlist in `block` mode.
      # Mirrors build.yml's build-windows: PyPI for python deps, github.com +
      # objects.githubusercontent.com for Deno/FFmpeg release downloads, and
      # the four Sigstore endpoints (incl. sigstore.github.com) for the
      # attest-build-provenance step.
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: block
        disable-sudo: true                 # Windows; no sudo step
        allowed-endpoints: >
          api.github.com:443
          codeload.github.com:443
          files.pythonhosted.org:443
          fulcio.sigstore.dev:443
          github.com:443
          objects.githubusercontent.com:443
          pypi.org:443
          raw.githubusercontent.com:443
          rekor.sigstore.dev:443
          results-receiver.actions.githubusercontent.com:443
          sigstore.github.com:443
          tuf-repo-cdn.sigstore.dev:443
          *.blob.core.windows.net:443

    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false   # build only; attestation uses OIDC

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip==26.1.2
        pip install --require-hashes -r requirements/lock.txt
        pip install -e .[build]

    - name: Download and verify Deno
      run: |
        $ErrorActionPreference = "Stop"
        $version = $env:DENO_VERSION
        $base = "https://github.com/denoland/deno/releases/download/v$version"
        $assetUrl = "$base/deno-x86_64-pc-windows-msvc.zip"
        $sumUrl   = "$assetUrl.sha256sum"

        Write-Host "Downloading Deno $version from $assetUrl"
        Invoke-WebRequest -Uri $assetUrl -OutFile deno.zip
        Invoke-WebRequest -Uri $sumUrl   -OutFile deno.zip.sha256sum

        # Hash from the publisher's sidecar (defends against MITM / mirror tampering).
        # The sidecar layout varies (bare hash, "hash  file", or a multi-asset
        # checksums list), so extract the 64-hex digest robustly: prefer the line
        # naming our asset, else fall back to the only digest in the file.
        $assetName = "deno-x86_64-pc-windows-msvc.zip"
        $sumLines  = Get-Content deno.zip.sha256sum
        $publishedHash = $null
        foreach ($line in $sumLines) {
          if ($line -match [regex]::Escape($assetName)) {
            $m = [regex]::Match($line, '[A-Fa-f0-9]{64}')
            if ($m.Success) { $publishedHash = $m.Value.ToLower(); break }
          }
        }
        if (-not $publishedHash) {
          $m = [regex]::Match(($sumLines -join "`n"), '[A-Fa-f0-9]{64}')
          if ($m.Success) { $publishedHash = $m.Value.ToLower() }
        }
        if (-not $publishedHash) {
          Write-Error "Could not parse a SHA-256 from the Deno sidecar. Raw content:`n$($sumLines -join "`n")"
          exit 1
        }
        # Hash actually computed from what we received.
        $actualHash    = (Get-FileHash -Algorithm SHA256 deno.zip).Hash.ToLower()

        if ($actualHash -ne $publishedHash) {
          Write-Error "Deno SHA-256 mismatch vs publisher sidecar. Expected: $publishedHash  Actual: $actualHash"
          exit 1
        }

        # Hash hardcoded in the repo (defends against release compromise).
        $pinnedHash = $env:DENO_SHA256.ToLower()
        if ($pinnedHash -eq "") {
          Write-Warning "DENO_SHA256 is unset. Verified against publisher sidecar only."
          Write-Warning "Pin this value in release.yml after manual cross-check: $actualHash"
        } elseif ($actualHash -ne $pinnedHash) {
          Write-Error "Deno SHA-256 mismatch vs pinned hash. Pinned: $pinnedHash  Actual: $actualHash"
          exit 1
        }

        Write-Host "Deno SHA-256 verified: $actualHash"
        New-Item -ItemType Directory -Force -Path deno | Out-Null
        Expand-Archive -Path deno.zip -DestinationPath deno
        Remove-Item deno.zip, deno.zip.sha256sum
        deno/deno.exe --version

    - name: Download and verify FFmpeg
      run: |
        $ErrorActionPreference = "Stop"
        $version = $env:FFMPEG_VERSION
        # GyanD/codexffmpeg is the GitHub-hosted mirror of the gyan.dev builds.
        # Versioned URL (not the moving "release-full-shared" alias) so the artifact is reproducible.
        $assetUrl = "https://github.com/GyanD/codexffmpeg/releases/download/$version/ffmpeg-$version-full_build-shared.7z"

        Write-Host "Downloading FFmpeg $version from $assetUrl"
        Invoke-WebRequest -Uri $assetUrl -OutFile ffmpeg.7z

        $actualHash = (Get-FileHash -Algorithm SHA256 ffmpeg.7z).Hash.ToLower()
        $pinnedHash = $env:FFMPEG_SHA256.ToLower()
        if ($actualHash -ne $pinnedHash) {
          Write-Error "FFmpeg SHA-256 mismatch. Pinned: $pinnedHash  Actual: $actualHash"
          exit 1
        }
        Write-Host "FFmpeg SHA-256 verified: $actualHash"

        7z x ffmpeg.7z -offmpeg_temp
        New-Item -ItemType Directory -Force -Path ffmpeg/bin | Out-Null
        Copy-Item -Path "ffmpeg_temp/ffmpeg-*-full_build-shared/bin/ffmpeg.exe" -Destination "ffmpeg/bin/"
        Copy-Item -Path "ffmpeg_temp/ffmpeg-*-full_build-shared/bin/ffprobe.exe" -Destination "ffmpeg/bin/"
        Copy-Item -Path "ffmpeg_temp/ffmpeg-*-full_build-shared/bin/ffplay.exe" -Destination "ffmpeg/bin/" -ErrorAction SilentlyContinue
        Copy-Item -Path "ffmpeg_temp/ffmpeg-*-full_build-shared/bin/*.dll" -Destination "ffmpeg/bin/"
        Write-Host "FFmpeg files:"
        Get-ChildItem -Path "ffmpeg/bin" | Select-Object Name, Length
        Remove-Item ffmpeg.7z
        Remove-Item -Recurse ffmpeg_temp

    - name: Sync version metadata
      # Regenerates version_info.txt from src/__init__.py (`__version__`) so the
      # Windows EXE's embedded ProductVersion/FileVersion always match the
      # canonical Python version, even if a developer forgot to run the script
      # locally before tagging.
      run: python scripts/sync_version.py

    - name: Build executable
      run: pyinstaller packaging/build.spec

    - name: Verify build
      run: |
        if (-Not (Test-Path "dist/yt-dlp-studio.exe")) {
          Write-Error "Build failed: yt-dlp-studio.exe not found!"
          exit 1
        }
        $fileSize = (Get-Item "dist/yt-dlp-studio.exe").Length / 1MB
        Write-Host "Build verified: yt-dlp-studio.exe ($([math]::Round($fileSize, 2)) MB)"

    - name: Generate build provenance attestation
      # Produces a Sigstore-signed SLSA provenance statement binding the
      # exe's SHA-256 to this workflow file at this commit on this runner.
      # Verify with: gh attestation verify dist/yt-dlp-studio.exe --owner NX1X
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-path: 'dist/yt-dlp-studio.exe'

    - name: Create Windows archive
      env:
        VERSION: ${{ needs.check-version.outputs.version }}
      run: |
        $version = $env:VERSION
        $archiveName = "yt-dlp-studio-$version-Windows.zip"
        New-Item -ItemType Directory -Force -Path release
        Copy-Item -Path "dist/yt-dlp-studio.exe" -Destination "release/"
        $readme = @(
            "yt-dlp-studio $version",
            "================================",
            "",
            "INSTALLATION",
            "1. Extract this ZIP file to any folder",
            "2. Run yt-dlp-studio.exe",
            "",
            "REQUIREMENTS",
            "- Windows 10/11 (64-bit)",
            "- No additional software needed (FFmpeg included)",
            "",
            "SUPPORT",
            "- Website: https://nx1xlab.dev/nxtools",
            "- Support development: https://buymeacoffee.com/nx1x"
        ) -join "`r`n"
        $readme | Out-File -FilePath "release/README.txt" -Encoding UTF8
        Compress-Archive -Path "release/*" -DestinationPath $archiveName
        Write-Host "Archive created: $archiveName"

    - name: Copy standalone exe for direct download
      env:
        VERSION: ${{ needs.check-version.outputs.version }}
      run: |
        $version = $env:VERSION
        Copy-Item -Path "dist/yt-dlp-studio.exe" -Destination "YT-DLP Studio.exe"
        Write-Host "Standalone exe: YT-DLP Studio.exe"

    - name: Upload Windows artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: windows-release
        path: |
          yt-dlp-studio-*-Windows.zip
          YT-DLP Studio.exe

  build-linux:
    name: Build Linux Executable
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    # Pinned to ubuntu-22.04 (glibc 2.35), NOT ubuntu-latest. The shipped
    # PyInstaller binary cannot run on a glibc older than the build host's, so
    # building on 24.04 (glibc 2.39) would lock users out of most pre-2024
    # distros. 22.04's 2.35 covers Ubuntu 22.04+, Debian 12+, Fedora 36+, and
    # most 2022-and-later distributions. Keep in lockstep with build.yml.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write       # OIDC token for Sigstore signing
      attestations: write   # Publish build provenance attestation
    steps:
    - name: Harden runner
      # StepSecurity harden-runner: per-job egress allowlist in `block` mode.
      # Mirrors the Linux test allowlist plus PyInstaller wheel fetches and the
      # Sigstore endpoints required by attest-build-provenance (incl. the often-
      # missed sigstore.github.com). Kept in lockstep with build-windows.
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: block
        disable-sudo: false                # `sudo apt-get` for EGL/dbus libs
        allowed-endpoints: >
          api.github.com:443
          azure.archive.ubuntu.com:80
          codeload.github.com:443
          esm.ubuntu.com:443
          files.pythonhosted.org:443
          fulcio.sigstore.dev:443
          github.com:443
          objects.githubusercontent.com:443
          packages.microsoft.com:443
          pypi.org:443
          raw.githubusercontent.com:443
          rekor.sigstore.dev:443
          results-receiver.actions.githubusercontent.com:443
          security.ubuntu.com:80
          sigstore.github.com:443
          tuf-repo-cdn.sigstore.dev:443
          *.blob.core.windows.net:443

    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false   # build only, never pushes via git

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libglib2.0-0 libgl1 libfontconfig1

    - name: Install Python dependencies
      # `pip install pyinstaller` used to be bare; Scorecard's
      # PinnedDependenciesID flags any pip install without a hash anchor
      # or an exact-version pin. The upstream `.[build]` extras contain
      # `pyinstaller>=6.3.0`, but on this Linux path we hardpin so the
      # tag we build against never drifts silently. Renovate's pypi
      # manager keeps this in step with the ecosystem.
      run: |
        python -m pip install --upgrade pip==26.1.2
        pip install --require-hashes -r requirements/lock.txt
        pip install pyinstaller==6.21.0

    - name: Sync version metadata
      # Linux build_linux.spec doesn't currently use version_info.txt, but
      # running the sync keeps the file in lockstep with __version__ in case
      # the Linux spec ever embeds version metadata (or for sdist builds).
      run: python scripts/sync_version.py

    - name: Build Linux binary
      run: pyinstaller packaging/build_linux.spec
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Verify build
      run: |
        if [ ! -f "dist/yt-dlp-studio" ]; then
          echo "Build failed: yt-dlp-studio not found!"
          exit 1
        fi
        ls -lh dist/yt-dlp-studio
        chmod +x dist/yt-dlp-studio

    - name: Smoke-test the binary (headless launch)
      # Runtime-test the frozen binary before attesting/publishing it: launch it
      # under the offscreen Qt platform, wait for the "started successfully"
      # milestone (logged after the main window is shown), then stop it. The
      # frozen app skips the Deno download (sys.frozen), so this needs no
      # network. A broken bundle that still produces a file fails here instead
      # of shipping to users.
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        ./dist/yt-dlp-studio > smoke.log 2>&1 &
        APP_PID=$!
        ok=0
        for _ in $(seq 1 30); do
          if grep -q "started successfully" smoke.log 2>/dev/null; then ok=1; break; fi
          if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
          sleep 1
        done
        kill "$APP_PID" 2>/dev/null || true
        wait "$APP_PID" 2>/dev/null || true
        echo "----- smoke.log -----"
        cat smoke.log || true
        if [ "$ok" -ne 1 ]; then
          echo "Smoke test FAILED: app did not reach 'started successfully'."
          exit 1
        fi
        echo "Smoke test passed: the frozen binary launched and initialized."

    - name: Generate build provenance attestation
      # Sigstore-signed SLSA provenance binding the binary's SHA-256 to this
      # workflow at this commit. Verify with:
      #   gh attestation verify dist/yt-dlp-studio --owner NX1X
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-path: 'dist/yt-dlp-studio'

    - name: Create Linux archive
      env:
        VERSION: ${{ needs.check-version.outputs.version }}
      run: |
        # Assemble a desktop-ready archive: the executable, hicolor icons, a
        # .desktop launcher, and install/uninstall scripts (see
        # packaging/linux/). install.sh wires everything into the user's
        # application menu without root.
        mkdir -p release/icons
        cp dist/yt-dlp-studio release/
        chmod +x release/yt-dlp-studio
        cp packaging/linux/install.sh release/
        cp packaging/linux/uninstall.sh release/
        chmod +x release/install.sh release/uninstall.sh
        cp packaging/linux/yt-dlp-studio.desktop release/
        cp packaging/linux/yt-dlp-studio-32.png release/icons/
        cp packaging/linux/yt-dlp-studio-48.png release/icons/
        cp packaging/linux/yt-dlp-studio-64.png release/icons/
        cp packaging/linux/yt-dlp-studio-128.png release/icons/
        cp packaging/linux/yt-dlp-studio-256.png release/icons/
        cat > release/README.txt << 'EOF'
        yt-dlp-studio - Linux
        ================================

        QUICK INSTALL (recommended)
        1. Extract this archive to any folder
        2. Run: ./install.sh
           This adds YT-DLP Studio to your application menu and installs the
           icon and launcher into ~/.local (no root required).
        3. Launch it from your app menu, or run: yt-dlp-studio

        RUN WITHOUT INSTALLING
        1. Make executable: chmod +x yt-dlp-studio
        2. Run: ./yt-dlp-studio

        UNINSTALL
        Run: ./uninstall.sh

        REQUIREMENTS
        - 64-bit Linux, glibc 2.35+ (Ubuntu 22.04+, Debian 12+, Fedora 36+,
          Mint 21+, Arch, and most 2022-and-later distributions).
        - A desktop environment (GNOME/KDE/XFCE/...) - provides the standard
          Qt runtime libraries (libglib, libGL, fontconfig). Minimal/server
          installs may need these installed via your package manager.
        - FFmpeg must be installed. install.sh prints the right command for
          your package manager; e.g. Debian/Ubuntu: sudo apt install ffmpeg,
          Fedora: sudo dnf install ffmpeg, Arch: sudo pacman -S ffmpeg.
        - Deno (optional): auto-downloaded on first run, or install from
          https://deno.land

        SUPPORT
        - Website: https://nx1xlab.dev/nxtools
        - Support development: https://buymeacoffee.com/nx1x
        EOF
        tar -czf "yt-dlp-studio-${VERSION}-Linux.tar.gz" -C release .
        echo "Archive created: yt-dlp-studio-${VERSION}-Linux.tar.gz"

    - name: Upload Linux artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: linux-release
        path: yt-dlp-studio-*-Linux.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [check-version, build-windows, build-linux]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Harden runner
      # StepSecurity harden-runner: per-job egress allowlist in `block` mode.
      # This job pushes the immutable release tag via `git push` (covered by
      # github.com) and uses softprops/action-gh-release for the release +
      # asset upload. uploads.github.com is the multipart PUT endpoint for
      # release assets and is required ONLY by this job — without it the
      # release object is created but file uploads silently fail.
      uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
      with:
        egress-policy: block
        disable-sudo: true
        allowed-endpoints: >
          api.github.com:443
          codeload.github.com:443
          github.com:443
          objects.githubusercontent.com:443
          raw.githubusercontent.com:443
          results-receiver.actions.githubusercontent.com:443
          uploads.github.com:443
          *.blob.core.windows.net:443

    # NOTE: this checkout intentionally KEEPS the persisted credential — the
    # next step pushes the immutable release tag via `git push origin`. Adding
    # persist-credentials: false here would break tag publishing.
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 # zizmor: ignore[artipacked]

    - name: Create immutable tag if absent
      # Immutable-release policy: a version is published EXACTLY ONCE. The
      # release assets are frozen by GitHub release immutability and the tag
      # by the protect-tags ruleset; neither can be regenerated. check-version
      # only sets should_release=true when the tag is absent, so the "exists"
      # branch below is just a defensive guard against partial-failure reruns.
      # To ship anything, bump __version__ (a NEW version/tag).
      env:
        VERSION: ${{ needs.check-version.outputs.version }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
          echo "Tag $VERSION already exists - immutable, nothing to do."
        else
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
          echo "Created and pushed immutable tag $VERSION"
        fi

    - name: Download Windows artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: windows-release
        path: ./artifacts/

    - name: Download Linux artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: linux-release
        path: ./artifacts/

    - name: List artifacts
      run: ls -la artifacts/

    - name: Build release notes from CHANGELOG
      # The GitHub Release body is generated from the version's own CHANGELOG.md
      # section, so each release shows what actually changed in it - not a
      # static, identical feature list. Downloads + system requirements +
      # credits are appended as boilerplate.
      env:
        TAG: ${{ needs.check-version.outputs.version }}
      run: |
        set -euo pipefail
        VERSION="${TAG#v}"   # strip the leading v: v0.2.0 -> 0.2.0

        # Extract the lines under "## [VERSION]" up to (but not including) the
        # next "## [" heading, dropping the "---" section separators.
        NOTES=$(awk -v hdr="## [${VERSION}]" '
          index($0, hdr) == 1 { found = 1; next }
          found && /^## \[/   { exit }
          found && $0 == "---" { next }
          found               { print }
        ' CHANGELOG.md)
        # Trim leading/trailing blank lines.
        NOTES="$(printf '%s\n' "$NOTES" | sed -e :a -e '/^\n*$/{$d;N;ba}' -e '/./,$!d')"
        if [ -z "$NOTES" ]; then
          echo "::warning::No CHANGELOG.md section found for ${VERSION}; using a fallback body."
          NOTES="See the [CHANGELOG](https://github.com/NX1X/yt-dlp-studio/blob/main/CHANGELOG.md) for details."
        fi

        {
          echo "### Downloads"
          echo
          echo "| Platform | File | Notes |"
          echo "|----------|------|-------|"
          echo "| **Windows** | \`yt-dlp-studio-...-Windows.zip\` | Includes FFmpeg + Deno. Just extract and run. |"
          echo "| **Linux** | \`yt-dlp-studio-...-Linux.tar.gz\` | Extract and run \`./install.sh\` to add it to your app menu. Requires system FFmpeg. |"
          echo
          echo "### What's changed in ${VERSION}"
          echo
          echo "${NOTES}"
          echo
          echo "### System requirements"
          echo
          echo "**Windows:** Windows 10/11 (64-bit) - no additional software needed."
          echo
          echo "**Linux:** 64-bit, glibc 2.35+ (Ubuntu 22.04+, Debian 12+, Fedora 36+, and most 2022-and-later distros). Requires FFmpeg; Deno is auto-downloaded on first run."
          echo
          echo "### Credits"
          echo
          echo "Part of **NXTools** by **NX1X** - https://nx1xlab.dev/nxtools · Support development: https://buymeacoffee.com/nx1x"
          echo
          echo "Full history: [CHANGELOG.md](https://github.com/NX1X/yt-dlp-studio/blob/main/CHANGELOG.md)"
        } > RELEASE_BODY.md

        echo "----- RELEASE_BODY.md -----"
        cat RELEASE_BODY.md

    # Deliberately use the pinned, SHA-locked action rather than a `gh release`
    # script step: it is part of the audited/attested release path and Renovate
    # tracks its digest. Replacing it with raw gh is out of scope here.
    - name: Create Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0 # zizmor: ignore[superfluous-actions]
      with:
        tag_name: ${{ needs.check-version.outputs.version }}
        name: yt-dlp-studio ${{ needs.check-version.outputs.version }}
        body_path: RELEASE_BODY.md
        files: |
          artifacts/*
        draft: false
        prerelease: ${{ needs.check-version.outputs.is_prerelease == 'true' }}
        # Explicitly flag the newest non-prerelease build as "Latest" so the
        # repo's Releases page / "latest" API always points here. A prerelease
        # never becomes Latest.
        make_latest: ${{ needs.check-version.outputs.is_prerelease == 'true' && 'false' || 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
