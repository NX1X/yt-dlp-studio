# SonarCloud project configuration for yt-dlp-studio.
# Docs: https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-scope/
#
# Without these exclusions, SonarCloud scanned the entire vendored yt-dlp
# tree and reported ~260 issues we cannot act on (e.g. python:S1192 string
# duplication across 1000+ extractor modules, by-design code-smell findings
# in upstream yt-dlp's networking/postprocessor packages). Those numbers
# drown out the handful of issues in code we actually own.

sonar.projectKey=NX1X_yt-dlp-studio
sonar.organization=nx1x-lab

# Exclude vendored upstream code, internal maintainer docs, the local venv,
# build artifacts, and anything PyInstaller drops in dist/. The Python tests
# are intentionally KEPT in scope: catching real test smells is useful, and
# the handful of false positives there are suppressed inline.
sonar.exclusions=\
    vendor/**,\
    docs-internal/**,\
    venv/**,\
    .venv/**,\
    build/**,\
    dist/**,\
    **/__pycache__/**,\
    **/*.pyc

# Test files live here. Sonar applies a different (less strict) ruleset to
# test code automatically when `sonar.tests` is set.
sonar.sources=src,launcher.py,scripts
sonar.tests=tests

# Coverage report path is set by the CI workflow (sonarcloud-github-action
# step). No coverage config here.

# translations.py is an i18n data file: the same UI word legitimately appears
# as the value for several keys (and repeats across the en/he dictionaries), so
# S1192 string-literal duplication is a false positive there. Suppress it only
# for that file; S1192 stays active everywhere else.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/translations.py
# S8565 wants a uv/poetry/pdm lock file; this project pins dependencies via
# requirements/lock.txt and requirements/ci-tools.txt with --require-hashes,
# which the text analyzer does not recognize. False positive on pyproject.toml.
sonar.issue.ignore.multicriteria.e2.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.e2.resourceKey=**/pyproject.toml
# YtDlpWrapper.download() is a large, well-tested critical path. Splitting it
# (helpers + a DownloadOptions object) needs live download testing and is
# tracked in ROADMAP v0.4.0; do not block on it here.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/yt_dlp_wrapper.py
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e4.resourceKey=**/yt_dlp_wrapper.py
# S5869 false positive: the credential character class [A-Za-z0-9._+/=-] has no
# duplicate members (the leading/trailing '-' heuristic misfires).
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S5869
sonar.issue.ignore.multicriteria.e5.resourceKey=**/secret_scrub.py
# S8541/S8544 on `pip install -e .[dev|build]`: --only-binary is incompatible
# with an editable/local-project install, and pinning the dev/build tool set
# behind a hash-locked file is a tracked follow-up (see 0.1.3 notes). All other
# installs already use --require-hashes + --only-binary.
sonar.issue.ignore.multicriteria.e6.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e6.resourceKey=.github/workflows/*.yml
sonar.issue.ignore.multicriteria.e7.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e7.resourceKey=.github/workflows/*.yml

# Supported runtimes (matches requires-python >=3.10 in pyproject.toml).
sonar.python.version=3.10, 3.11, 3.12, 3.13
